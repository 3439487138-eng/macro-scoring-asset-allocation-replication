name: Macro allocation replication

on:
  workflow_dispatch:
    inputs:
      run_replication:
        description: "Run the real-data strategy after all strict blockers are resolved"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macro-allocation-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate environment
        run: python -m pip check

      - name: Compile source
        run: python -m compileall -q run_replication.py src tools tests

      - name: Validate safe project structure
        run: python run_replication.py validate-config --structure-only

      - name: Run tests
        run: python -m pytest -q

      - name: Scan explicit upload candidates
        run: python tools/check_upload_candidates.py

  replicate:
    if: ${{ inputs.run_replication }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run real-data replication
        run: python run_replication.py run

      - name: Validate current-run report
        run: python tools/validate_report.py

      - name: Upload validated reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-allocation-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            outputs/report.json
            outputs/report.html
            outputs/metrics.csv
            outputs/nav.csv
            outputs/positions.csv
            outputs/factor_signals.csv
            outputs/run_manifest.json
            outputs/equity_curve.png

      - name: Commit and push approved outputs only
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- outputs/report.json outputs/report.html outputs/metrics.csv outputs/nav.csv outputs/positions.csv outputs/factor_signals.csv outputs/run_manifest.json outputs/equity_curve.png
          if git diff --cached --quiet; then
            echo "No approved output changes to commit."
          else
            git commit -m "chore: update replication outputs (run ${RUN_ID})"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
