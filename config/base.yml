project:
  name: "资产配置宏观打分策略"
  mode: strict_reproduction
  license_status: pending_owner_confirmation
  sample_start: "2008-01-01"
  sample_end: "2024-12-31"
  return_frequency: monthly
  initial_window_months: 36
  signal_lag_months: 1
  transaction_cost_bps: 0.0
  benchmark: null

data:
  provider: local_snapshot
  root_env: MACRO_STRATEGY_DATA_DIR
  license_status: unconfirmed
  files:
    asset_levels: "China Rolled Return.csv"
    china_equity_level: "China Rolled Return2.csv"
    domestic_macro: "china-data.csv"
    global_macro: "data_indicator_review.csv"
  date_fields:
    asset_levels: date
    china_equity_level: date
    domestic_macro: release_date
    global_macro: release_date

assets:
  CH_EQUITY:
    column: CSI800
    return_semantics: price_level
  CH_BOND:
    column: 1Oyear_bond
    return_semantics: yield_level
  US_EQUITY:
    column: PPP500
    return_semantics: price_level
  GOLD:
    column: SGE_gold
    return_semantics: price_level
  OIL:
    column: oil
    return_semantics: price_level
  SHORT_BOND:
    column: short_financing
    return_semantics: price_level

factors:
  domestic_economy:
    indicators: [china_non-industrial_PMI, china_industrial_PMI, loan, property_index]
    level_indicators: [china_non-industrial_PMI, china_industrial_PMI]
    yoy_indicators: [loan, property_index]
    smoothing_window: 12
  domestic_currency:
    indicators: [china_1Ybond, china_indicator_reserve-ration, china_market-operations]
    change_periods: 12
    smoothing_window: 3
    signal_smoothing_window: 6
  domestic_credit:
    indicators: [china_medium_long-term_loans]
    rolling_sum_months: 12
    yoy_periods: 12
  domestic_expectation:
    indicators: [china_expectation_of_trade]
    ewm_halflife: 3
    neutral_range: 5
  domestic_inflation:
    indicators: [china_inflation_PMI]
    threshold_window: 36
  domestic_fx:
    indicators: [china_CN]
    momentum_months: 3
    internal_lag_months: 1
    lag_review_status: unresolved
  global_economy:
    indicators: [usa_pmi, china_pmi_new_export_orders, korea_exports, copper_lme, gold]
    smoothing_window: 12
  global_currency:
    indicators: [treasury_yld_1y, fed_securities_bs]
    yield_smoothing_window: 3
    rate_threshold: 0.03
    low_yield_threshold: 0.5
    holdings_change_threshold: 30
  global_inflation:
    indicators: [us_10y_breakeven_inflation]
    hp_lambda: 129600
    z_threshold: 1
  dollar_cycle:
    indicators: [dollar_index_dxy]
    hp_lambda: 129600
    z_threshold: 1
  global_financial_risk:
    indicators: [ofr_fsi]
    ewm_halflife: 36
    z_threshold: 1
  autoregression:
    lags: 12
    initial_window: 36

factor_weights:
  CH_EQUITY:
    dom_econ_signal: 1
    dom_curncy_signal: 1
    dom_credit_signal: 1
    dom_inflation_signal: -1
    global_econ_signal: 0
    global_curncy_signal: 1
    global_inflation_signal: 0
    dollar_cycle_signal: -1
    fin_risk_signal: -1
    ar_signal: 0
  CH_BOND:
    dom_econ_signal: -1
    dom_curncy_signal: 1
    dom_credit_signal: -1
    dom_inflation_signal: -1
    global_econ_signal: 0
    global_curncy_signal: 0
    global_inflation_signal: 0
    dollar_cycle_signal: 1
    fin_risk_signal: 1
    ar_signal: 0
  US_EQUITY:
    dom_econ_signal: 0
    dom_curncy_signal: 0
    dom_credit_signal: 0
    dom_inflation_signal: 0
    global_econ_signal: 1
    global_curncy_signal: 1
    global_inflation_signal: 0
    dollar_cycle_signal: 0
    fin_risk_signal: -1
    ar_signal: 0
  GOLD:
    dom_econ_signal: 0
    dom_curncy_signal: 0
    dom_credit_signal: 0
    dom_inflation_signal: 0
    global_econ_signal: -1
    global_curncy_signal: 0
    global_inflation_signal: 0
    dollar_cycle_signal: 0
    fin_risk_signal: 1
    ar_signal: 0
  OIL:
    dom_econ_signal: 0
    dom_curncy_signal: 0
    dom_credit_signal: 0
    dom_inflation_signal: 0
    global_econ_signal: 1
    global_curncy_signal: 1
    global_inflation_signal: 1
    dollar_cycle_signal: -1
    fin_risk_signal: -1
    ar_signal: 0
  SHORT_BOND:
    dom_econ_signal: 0
    dom_curncy_signal: -1
    dom_credit_signal: 0
    dom_inflation_signal: 1
    global_econ_signal: 0
    global_curncy_signal: -1
    global_inflation_signal: -1
    dollar_cycle_signal: 0
    fin_risk_signal: 0
    ar_signal: 0

# Preserved exactly from the notebook. CREDIT is intentionally unresolved and
# must not be silently treated as SHORT_BOND or cash.
portfolio_weights:
  CH_EQUITY: 0.10
  CH_BOND: 0.40
  US_EQUITY: 0.05
  GOLD: 0.30
  OIL: 0.05
  CREDIT: 0.10

outputs:
  directory: outputs
  approved_files:
    - report.json
    - report.html
    - metrics.csv
    - nav.csv
    - positions.csv
    - factor_signals.csv
    - run_manifest.json
    - equity_curve.png

