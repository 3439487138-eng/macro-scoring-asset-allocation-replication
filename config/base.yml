project:
  name: "资产配置宏观打分策略"
  mode: practical_adaptation
  license_status: pending_owner_confirmation
  sample_start: "2018-01-31"
  sample_end: "2026-08-31"
  return_frequency: monthly
  signal_lag_months: 1
  transaction_cost_bps: 10.0
  risk_free_rate: 0.0
  max_gross_exposure: 1.0
  benchmark: static_same_asset_mix

data:
  provider: yahoo_chart_runtime
  base_url: "https://query1.finance.yahoo.com/v8/finance/chart"
  download_start: "2013-01-01"
  as_of_date: "2026-08-31"
  cache_directory: "data/processed"
  timeout_seconds: 60
  max_attempts: 4
  license_status: runtime_access_only_no_raw_redistribution
  adjusted_close_note: "Adjusted close is used as a total-return approximation."

assets:
  CH_EQUITY:
    symbol: ASHR
    name: "Xtrackers Harvest CSI 300 China A-Shares ETF"
    role: "CSI 800 practical proxy"
    return_semantics: adjusted_close_total_return_proxy
  CH_BOND:
    symbol: CBON
    name: "VanEck China Bond ETF"
    role: "China government/policy bond practical proxy"
    return_semantics: adjusted_close_total_return_proxy
  US_EQUITY:
    symbol: SPY
    name: "SPDR S&P 500 ETF Trust"
    role: "US equity"
    return_semantics: adjusted_close_total_return_proxy
  GOLD:
    symbol: GLD
    name: "SPDR Gold Shares"
    role: "gold"
    return_semantics: adjusted_close_total_return_proxy
  OIL:
    symbol: USO
    name: "United States Oil Fund"
    role: "crude-oil futures practical proxy"
    return_semantics: adjusted_close_total_return_proxy
  CREDIT:
    symbol: VCSH
    name: "Vanguard Short-Term Corporate Bond ETF"
    role: "short-financing / short-duration investment-grade credit proxy"
    return_semantics: adjusted_close_total_return_proxy

cash:
  symbol: BIL
  name: "SPDR Bloomberg 1-3 Month T-Bill ETF"
  role: "explicit residual cash proxy"

macro_proxies:
  CNY:
    symbol: "CNY=X"
    role: "CNY per USD market close"
  COPPER:
    symbol: "HG=F"
    role: "COMEX copper futures"
  GOLD_FUTURE:
    symbol: "GC=F"
    role: "COMEX gold futures"
  DOLLAR:
    symbol: "DX-Y.NYB"
    role: "US Dollar Index"
  VIX:
    symbol: "^VIX"
    role: "equity volatility risk"
  LONG_TREASURY:
    symbol: TLT
    role: "long-duration US Treasury total-return proxy"

factor_model:
  winsor_window_months: 60
  min_history_months: 24
  lower_quantile: 0.05
  upper_quantile: 0.95
  domestic_economy_momentum_months: 6
  domestic_currency_momentum_months: 3
  domestic_credit_momentum_months: 6
  domestic_expectation_momentum_months: 3
  domestic_inflation_momentum_months: 6
  global_economy_momentum_months: 6
  global_currency_momentum_months: 3
  global_inflation_momentum_months: 6
  dollar_cycle_momentum_months: 6
  autoregression_lags: 12
  autoregression_initial_window: 36
  fx_internal_lag_months: 0
  execution_lag_months: 1

factor_weights:
  CH_EQUITY:
    dom_econ_signal: 1
    dom_curncy_signal: 1
    dom_credit_signal: 1
    dom_inflation_signal: -1
    global_econ_signal: 0
    global_curncy_signal: 1
    global_inflation_signal: 0
    dollar_cycle_signal: -1
    fin_risk_signal: -1
    ar_signal: 0
  CH_BOND:
    dom_econ_signal: -1
    dom_curncy_signal: 1
    dom_credit_signal: -1
    dom_inflation_signal: -1
    global_econ_signal: 0
    global_curncy_signal: 0
    global_inflation_signal: 0
    dollar_cycle_signal: 1
    fin_risk_signal: 1
    ar_signal: 0
  US_EQUITY:
    dom_econ_signal: 0
    dom_curncy_signal: 0
    dom_credit_signal: 0
    dom_inflation_signal: 0
    global_econ_signal: 1
    global_curncy_signal: 1
    global_inflation_signal: 0
    dollar_cycle_signal: 0
    fin_risk_signal: -1
    ar_signal: 0
  GOLD:
    dom_econ_signal: 0
    dom_curncy_signal: 0
    dom_credit_signal: 0
    dom_inflation_signal: 0
    global_econ_signal: -1
    global_curncy_signal: 0
    global_inflation_signal: 0
    dollar_cycle_signal: 0
    fin_risk_signal: 1
    ar_signal: 0
  OIL:
    dom_econ_signal: 0
    dom_curncy_signal: 0
    dom_credit_signal: 0
    dom_inflation_signal: 0
    global_econ_signal: 1
    global_curncy_signal: 1
    global_inflation_signal: 1
    dollar_cycle_signal: -1
    fin_risk_signal: -1
    ar_signal: 0
  CREDIT:
    dom_econ_signal: 0
    dom_curncy_signal: -1
    dom_credit_signal: 0
    dom_inflation_signal: 1
    global_econ_signal: 0
    global_curncy_signal: -1
    global_inflation_signal: -1
    dollar_cycle_signal: 0
    fin_risk_signal: 0
    ar_signal: 0

portfolio_weights:
  CH_EQUITY: 0.10
  CH_BOND: 0.40
  US_EQUITY: 0.05
  GOLD: 0.30
  OIL: 0.05
  CREDIT: 0.10

outputs:
  directory: outputs
  approved_files:
    - performance_metrics.csv
    - monthly_returns.csv
    - nav_curve.csv
    - allocation_weights.csv
    - asset_returns.csv
    - macro_scores.csv
    - rebalance_records.csv
    - duplicate_records.csv
    - input_manifest.json
    - backtest_report.md
    - report.json
    - report.html
    - figures/nav_curve.png
    - figures/drawdown_curve.png
    - figures/allocation_weights.png
